
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200" fill="none">
  <!-- Navy color: #1D234D, Emerald Green: #00A66A -->
  <g id="houshran-logo">
    
    <!-- === NOON (ن) === Leftmost deep crescent bowl -->
    <path 
      d="M 52 108 
         C 46 128, 56 154, 82 168 
         C 108 180, 142 178, 166 156 
         C 180 142, 186 122, 186 98 
         L 164 98 
         C 164 116, 158 132, 146 142 
         C 130 156, 106 156, 88 144 
         C 72 134, 70 118, 74 102 
         Z" 
      fill="#1D234D" 
    />
    
    <!-- Noon Diamond Dot (Green) -->
    <polygon 
      points="84,80 97,67 110,80 97,93" 
      fill="#00A66A" 
    />

    <!-- === ALEF (ا) === Pillar -->
    <path 
      d="M 198 48 
         C 198 40, 206 34, 215 34 
         C 224 34, 230 40, 230 48 
         L 218 152 
         C 218 160, 211 166, 202 166 
         C 194 166, 188 160, 188 152 
         Z" 
      fill="#1D234D" 
    />

    <!-- === REH (ر) === Descender -->
    <path 
      d="M 288 88 
         C 280 118, 258 150, 224 168 
         C 216 172, 210 168, 208 162 
         C 207 156, 211 150, 218 146 
         C 246 132, 264 110, 270 88 
         Z" 
      fill="#1D234D" 
    />

    <!-- === SHIN (ش) === Three waves -->
    <path 
      d="M 278 88 
         C 278 76, 290 70, 298 80 
         C 308 70, 320 76, 326 86 
         C 334 72, 350 72, 358 88 
         L 374 88 
         C 382 88, 384 94, 380 102 
         C 356 138, 312 124, 278 88 
         Z" 
      fill="#1D234D" 
    />

    <!-- Shin 3 Diamond Dots (Green Triangle) -->
    <!-- Top Dot -->
    <polygon points="326,30 338,18 350,30 338,42" fill="#00A66A" />
    <!-- Bottom Left Dot -->
    <polygon points="310,50 322,38 334,50 322,62" fill="#00A66A" />
    <!-- Bottom Right Dot -->
    <polygon points="342,50 354,38 366,50 354,62" fill="#00A66A" />

    <!-- === VAV (و) === Head loop and tail -->
    <path 
      d="M 398 84 
         C 398 68, 412 56, 428 56 
         C 444 56, 458 68, 458 84 
         C 458 100, 444 112, 428 112 
         C 412 112, 398 100, 398 84 
         Z 
         M 428 72 
         C 421 72, 416 77, 416 84 
         C 416 91, 421 96, 428 96 
         C 435 96, 440 91, 440 84 
         C 440 77, 435 72, 428 72 
         Z" 
      fill="#1D234D" 
    />
    <path 
      d="M 448 92 
         C 456 114, 452 140, 428 160 
         C 412 172, 398 174, 392 168 
         C 388 162, 392 154, 400 150 
         C 418 138, 428 122, 430 92 
         Z" 
      fill="#1D234D" 
    />

    <!-- === HEH (هـ) === Big loop -->
    <path 
      d="M 436 92 
         C 450 64, 478 64, 486 86 
         C 494 108, 484 136, 458 144 
         C 436 150, 412 138, 404 118 
         C 400 106, 406 96, 416 96 
         C 424 96, 430 102, 434 112 
         C 440 124, 450 128, 460 122 
         C 470 116, 474 100, 468 88 
         C 462 78, 448 80, 436 92 
         Z" 
      fill="#1D234D" 
    />
  </g>
</svg>
