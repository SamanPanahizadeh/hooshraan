<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <defs>
    <style>
      .canvas-bg { fill: #ffffff; }
      .tint-accent { fill: #f9f6f0; }
      .ink { fill: #000000; }
    </style>
  </defs>

  <!-- Clean Canvas Background (1584x396) -->
  <rect width="1584" height="396" class="canvas-bg" />

  <!-- Subtle Bottom-Left Geometric Accent -->
  <polygon points="0,150 0,396 440,396" class="tint-accent" />

  <!-- Center Typography Group: "هوش ران" -->
  <g class="ink" transform="translate(530, 95)">

    <!-- ========================================== -->
    <!-- LEFT WORD: "ران"                           -->
    <!-- ========================================== -->

    <!-- Letter "ن" (Noon) -->
    <path d="
      M 30 110
      L 66 110
      C 66 160, 84 180, 118 180
      C 152 180, 170 160, 170 110
      L 206 110
      C 206 184, 172 216, 118 216
      C 64 216, 30 184, 30 110
      Z
    " />
    <!-- Square Dot of Noon -->
    <rect x="103" y="132" width="30" height="30" rx="3" />

    <!-- Letter "ا" (Alef) -->
    <rect x="224" y="48" width="32" height="168" rx="2" />

    <!-- Letter "ر" (Reh) -->
    <path d="
      M 288 110
      L 322 110
      L 322 148
      C 322 190, 286 216, 240 216
      L 240 182
      C 268 182, 288 168, 288 144
      Z
    " />

    <!-- ========================================== -->
    <!-- RIGHT WORD: "هوش"                          -->
    <!-- ========================================== -->

    <!-- Accent Chevron on top of Shin -->
    <path d="
      M 396 82
      L 416 48
      L 436 82
      L 416 70
      Z
    " />

    <!-- Teeth of Shin (3 stems) -->
    <rect x="380" y="84" width="30" height="36" />
    <rect x="422" y="84" width="30" height="36" />
    <rect x="464" y="84" width="30" height="36" />

    <!-- Sweep of Shin -->
    <path d="
      M 380 120
      L 494 120
      L 494 84
      L 526 84
      L 526 124
      C 526 174, 484 216, 422 216
      C 366 216, 326 186, 326 148
      L 360 148
      C 360 168, 384 182, 422 182
      C 462 182, 494 158, 494 120
      Z
    " />

    <!-- Letter "و" (Vav) -->
    <path d="
      M 526 84
      L 576 84
      C 602 84, 620 100, 620 124
      C 620 148, 602 164, 576 164
      L 526 164
      Z
      M 558 116
      L 576 116
      C 584 116, 590 120, 590 124
      C 590 128, 584 132, 576 132
      L 558 132
      Z
    " />
    <!-- Tail of Vav -->
    <path d="
      M 558 152
      C 558 178, 536 194, 504 194
      L 504 160
      C 522 160, 536 150, 536 140
      L 558 140
      Z
    " />

    <!-- Letter "هـ" (Heh) -->
    <path d="
      M 678 68
      C 726 68, 762 104, 762 152
      C 762 200, 726 236, 678 236
      C 630 236, 594 200, 594 152
      C 594 104, 630 68, 678 68
      Z
      M 678 102
      C 650 102, 628 124, 628 152
      C 628 180, 650 202, 678 202
      C 706 202, 728 180, 728 152
      C 728 124, 706 102, 678 102
      Z
    " />
    <!-- Center Eye of Heh -->
    <circle cx="678" cy="152" r="14" />

  </g>
</svg>
